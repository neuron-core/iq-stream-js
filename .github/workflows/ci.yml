name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The server the integration and browser tests run against. `npm run servers:start` starts it
  # twice: once with default settings, once with short timeouts.
  IQ_STREAM_TEST_IMAGE: ghcr.io/neuron-core/iq-stream:1

jobs:
  # Build, unit tests, and the packaging tests that keep the publisher out of browser bundles.
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit
      - run: npm run test:packaging

  # The same package under Next.js, with both of its bundlers: server, edge runtime and browser.
  next:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node --test --test-concurrency=1 test/packaging/next.test.mjs
        working-directory: packages/iq-stream
        env:
          IQ_STREAM_TEST_NEXT: 1

  # Publisher and client against a real IQ-Stream server.
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the server image
        run: |
          docker pull "$IQ_STREAM_TEST_IMAGE" || {
            echo "::error::Cannot pull $IQ_STREAM_TEST_IMAGE. Give this repository read access to the package (its settings on GitHub, 'Manage Actions access'), or make the image public."
            exit 1
          }
      - run: npm ci
      - run: npm run build
      - run: npm run servers:start
      - run: npm run test:integration

  # The browser client in Chromium: EventSource, fetch(), and React's useChat.
  browser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the server image
        run: |
          docker pull "$IQ_STREAM_TEST_IMAGE" || {
            echo "::error::Cannot pull $IQ_STREAM_TEST_IMAGE. Give this repository read access to the package (its settings on GitHub, 'Manage Actions access'), or make the image public."
            exit 1
          }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run servers:start
      - run: npm run test:browser
